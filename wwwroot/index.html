<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecipeFinder — что приготовить</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="brand">RecipeFinder</p>
      <h1>Что можно приготовить из того, что есть</h1>
      <p class="lead">Введи продукты через запятую — найдём подходящие рецепты в базе.</p>

      <form id="search-form" class="search">
        <label for="products-input" class="sr-only">Список продуктов</label>
        <input
          id="products-input"
          type="text"
          placeholder="например: яйца, молоко, соль"
          autocomplete="off"
        />
        <button type="submit">Найти рецепты</button>
      </form>
    </header>

    <main>
      <p id="status" class="status" aria-live="polite"></p>
      <section id="results" class="results" aria-label="Найденные рецепты"></section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
