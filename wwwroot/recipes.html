<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Рецепты — RecipeFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="logo" href="/">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8 10c0-2.2 1.8-4 4-4s4 1.8 4 4v1H8v-1Z" fill="currentColor" opacity=".35"/>
            <path d="M6 11h12v2.2c0 3.3-2.7 6-6 6s-6-2.7-6-6V11Z" fill="currentColor"/>
            <path d="M9 7.5V5.8M12 7V4.5M15 7.5V5.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="logo-text">RecipeFinder</span>
      </a>

      <nav class="nav" aria-label="Главное меню">
        <a class="nav-link" href="/">Главная</a>
        <a class="nav-link is-active" href="/recipes.html">Рецепты</a>
        <a class="nav-link" href="/products.html">Продукты</a>
        <a class="nav-link" href="/favorites.html">Избранное</a>
        <a class="nav-link" href="/#about">О проекте</a>
      </nav>

      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Тема" title="Тема">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 9 9c0-.4-.3-.8-.7-.9a5.5 5.5 0 0 1-7.4-7.4c-.1-.4-.5-.7-.9-.7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="user-menu" id="user-menu">
          <a class="avatar" id="user-avatar" href="/authorization.html" aria-label="Вход и регистрация" title="Вход">A</a>
          <div class="user-menu-panel" id="user-menu-panel" hidden>
            <p class="user-menu-name" id="user-menu-name"></p>
            <button type="button" class="user-menu-logout" id="user-menu-logout">Выйти</button>
          </div>
        </div>
      </div>
    </header>

    <section class="page-hero">
      <h1>Все рецепты</h1>
      <p class="page-lead">Каталог блюд из базы. Кликни карточку — откроются ингредиенты и шаги.</p>
    </section>

    <div class="products-toolbar">
      <label class="products-search">
        <span class="sr-only">Поиск по рецептам</span>
        <input id="recipes-filter" type="search" placeholder="Найти рецепт…" autocomplete="off" />
      </label>
      <span id="recipes-count" class="fav-count">0</span>
    </div>

    <p id="status" class="status" aria-live="polite">Загружаем…</p>

    <section class="workspace fav-workspace" id="workspace" hidden>
      <div class="results-pane">
        <div class="pane-head">
          <h2>Каталог</h2>
        </div>
        <div id="recipes-container" class="results results--fav" aria-label="Список рецептов"></div>
      </div>
      <aside id="detail" class="detail-pane" aria-label="Детали рецепта" hidden></aside>
    </section>

    <section class="empty-fav" id="empty" hidden>
      <p>Рецепты не найдены.</p>
      <a class="btn-fav-browse" href="/">Найти по продуктам</a>
    </section>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/recipes.js"></script>
</body>
</html>
